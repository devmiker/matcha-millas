services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql-auth
    networks:
      - matcha-network
    environment:
      SA_PASSWORD: "Str0ngP@ssw0rd!"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql

  auth-service:
    build:
      context: ./services/auth-service
    container_name: auth-service
    ports:
      - "5000:80"
    depends_on:
      - mssql
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - matcha-network

volumes:
  mssql_data:

networks:
  matcha-network:
    driver: bridge
